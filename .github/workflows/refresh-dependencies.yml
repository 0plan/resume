name: Refresh compatible dependencies
on:
  push:
    branches: ['enhance/resume-portfolio']
    paths: ['.github/workflows/refresh-dependencies.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record outdated dependencies and update within existing ranges
        run: |
          pnpm outdated || true
          pnpm update
          pnpm add -D @playwright/test
          pnpm list --depth 0
          pnpm outdated || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Audit updated dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refreshed-dependency-test-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Commit tested dependency manifests to the review branch
        run: |
          git fetch origin enhance/resume-portfolio
          test "$(git rev-parse origin/enhance/resume-portfolio)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh compatible dependencies and add Playwright"
            git push origin HEAD:enhance/resume-portfolio
          fi
